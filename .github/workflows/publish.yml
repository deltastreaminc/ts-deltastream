name: Publish
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      publish: ${{ steps.check.read-status.publish }}
    strategy:
      matrix:
        node-version: [24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      - run: pnpm changeset status --output=status.json

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: require-pr
        with:
          result-encoding: string
          script: |
            const fs = require('fs');
            const statusStr = fs.readFileSync('status.json', 'utf-8');
            const status = JSON.parse(statusStr);
            return status.changesets.length > 0 ? 'true' : 'false'

      - run: |-
          pnpm changeset status --verbose | tee /tmp/summary
          pnpm changeset version
        if: steps.require-pr.outputs.result == 'true'

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        if: steps.require-pr.outputs.result == 'true'
        id: create-pr-branch
        name: Create PR branch
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
              try {
                await github.rest.git.createRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: 'refs/heads/version-packages',
                  sha: '${{ github.sha }}'
                });
              } catch (error) {
                await github.rest.git.updateRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: 'heads/version-packages',
                  sha: '${{ github.sha }}',
                  force: true
                });
              }

      - uses: planetscale/ghcommit-action@13a844326508cdefc72235201bb0446d6d10a85f # v0.1.6
        if: steps.require-pr.outputs.result == 'true'
        with:
          commit_message: "Version packages"
          repo: ${{ github.repository }}
          branch: "version-packages"
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        if: steps.require-pr.outputs.result == 'true'
        id: create-pr
        name: Create PR
        with:
          github-token: ${{secrets.GITHUB_TOKEN}}
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/summary', 'utf-8');

            await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Version packages',
              head: 'version-packages',
              base: 'main',
              body: '```' + body + '```'
            });

      - run: |-
          pnpm run release
          git push origin main --tags
        if: steps.require-pr.outputs.result == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
